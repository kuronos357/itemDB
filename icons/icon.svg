<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Isometric Box/Location Nodes -->
  <g transform="translate(256, 256)">
    <!-- Top Face (Item/Location) -->
    <path d="M 0 -130 L 120 -60 L 0 10 L -120 -60 Z" fill="url(#grad)" opacity="0.9" />
    <!-- Left Face -->
    <path d="M -120 -60 L 0 10 L 0 140 L -120 70 Z" fill="#0284c7" />
    <!-- Right Face -->
    <path d="M 0 10 L 120 -60 L 120 70 L 0 140 Z" fill="#4f46e5" />
    <!-- Digital Data lines -->
    <circle cx="0" cy="-60" r="14" fill="#ffffff" />
    <circle cx="-60" cy="40" r="10" fill="#38bdf8" />
    <circle cx="60" cy="40" r="10" fill="#c084fc" />
    <line x1="0" y1="-60" x2="-60" y2="40" stroke="#ffffff" stroke-width="4" stroke-dasharray="6,4" />
    <line x1="0" y1="-60" x2="60" y2="40" stroke="#ffffff" stroke-width="4" stroke-dasharray="6,4" />
  </g>
</svg>
